<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Login - Gerenciamento de Itens" />
    <meta name="theme-color" content="#ea580c" />
    <title>Login — Gerenciamento de Itens</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <style>
      body {
        background-color: var(--clr-bg);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: var(--space-4);
      }
      .login-card {
        background: var(--clr-surface);
        border: 1.5px solid var(--clr-border);
        border-radius: var(--radius-xl);
        padding: var(--space-6);
        width: 100%;
        max-width: 400px;
        text-align: center;
        box-shadow: var(--shadow-lg);
      }
      .login-icon {
        font-size: 48px;
        color: var(--clr-brand);
        margin-bottom: var(--space-4);
      }
      .login-title {
        font-size: 24px;
        font-weight: 800;
        color: var(--clr-text);
        margin-bottom: var(--space-2);
      }
      .login-subtitle {
        font-size: 14px;
        color: var(--clr-text-muted);
        margin-bottom: var(--space-6);
      }
      .btn-google {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-3);
        width: 100%;
        background-color: #fff;
        color: #3c4043;
        border: 1px solid #dadce0;
        border-radius: var(--radius-full);
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
      }
      .btn-google:hover, .btn-google:active {
        background-color: #f8f9fa;
        box-shadow: 0 1px 2px 0 rgba(60,64,67,0.30), 0 1px 3px 1px rgba(60,64,67,0.15);
      }
      .btn-google img {
        width: 18px;
        height: 18px;
      }
      .loading-spinner {
        display: none;
        margin: 20px auto;
        border: 4px solid var(--clr-neutral-bg);
        border-top: 4px solid var(--clr-brand);
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>

    <div class="login-card">
      <div class="login-icon">📋</div>
      <h1 class="login-title">Gestão de Itens</h1>
      <p class="login-subtitle">Faça login para gerenciar seu estoque e histórico em tempo real.</p>
      
      <button class="btn-google" id="btnGoogleLogin">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" />
        Entrar com o Google
      </button>

      <div class="loading-spinner" id="loadingSpinner"></div>
    </div>

    <!-- ── TOAST CONTAINER ── -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <script type="module">
      import { auth, googleProvider, signInWithPopup, onAuthStateChanged } from './src/script/firebase-config.js';

      const btnGoogleLogin = document.getElementById('btnGoogleLogin');
      const spinner = document.getElementById('loadingSpinner');

      function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'times-circle'}"></i> ${message}`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.animation = 'toastOut 0.3s ease forwards';
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      // Check if already logged in
      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.href = './index.html';
        }
      });

      btnGoogleLogin.addEventListener('click', async () => {
        try {
          btnGoogleLogin.style.display = 'none';
          spinner.style.display = 'block';
          
          await signInWithPopup(auth, googleProvider);
          showToast('Login realizado com sucesso!');
          // Redirecionamento é feito pelo onAuthStateChanged acima
        } catch (error) {
          console.error("Erro no login:", error);
          showToast('Erro ao fazer login: ' + error.message, 'error');
          btnGoogleLogin.style.display = 'flex';
          spinner.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
