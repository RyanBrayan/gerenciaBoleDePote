<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Histórico de sessões de vendas. Consulte, filtre e gere relatórios em PDF." />
    <meta name="theme-color" content="#ea580c" />
    <title>Histórico de Vendas — Gerenciamento de Itens</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="stylesheet" href="./src/css/history.css" />
  </head>
  <body>

    <!-- ── HEADER ── -->
    <header class="app-header">
      <div class="app-header__logo">
        <button class="header-btn" id="btnBack" aria-label="Voltar">
          <i class="fas fa-arrow-left"></i>
        </button>
        <span class="app-header__logo-icon" style="margin-left:4px">📋</span>
        <span class="app-header__title">Histórico</span>
      </div>
      <div class="app-header__actions">
        <button class="header-btn" id="btnExportAll" title="Exportar tudo em PDF">
          <i class="fas fa-file-pdf"></i>
        </button>
      </div>
    </header>

    <!-- ── TOAST CONTAINER ── -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <!-- ── OVERLAY / BOTTOM SHEET FILTROS ── -->
    <div class="overlay" id="overlay"></div>

    <!-- Bottom Sheet: Filtros -->
    <div class="bottom-sheet" id="filterSheet" role="dialog" aria-modal="true" aria-label="Filtros">
      <div class="bottom-sheet__handle"></div>
      <p class="bottom-sheet__title">Filtrar Histórico</p>
      <div class="filter-sheet-grid">
        <div class="filter-sheet-row">
          <div class="form-group">
            <label class="form-label" for="filterCreationDate">Data de Criação</label>
            <input type="date" class="form-input" id="filterCreationDate" />
          </div>
          <div class="form-group">
            <label class="form-label" for="filterSaleDate">Data da Venda</label>
            <input type="date" class="form-input" id="filterSaleDate" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="filterPersonName">Nome da Pessoa</label>
          <input type="text" class="form-input" id="filterPersonName" placeholder="Buscar por nome" />
        </div>
        <div class="filter-sheet-row">
          <div class="form-group">
            <label class="form-label" for="filterPaidStatus">Pagamento</label>
            <div class="form-select-wrap">
              <select class="form-input" id="filterPaidStatus">
                <option value="all">Todos</option>
                <option value="paid">Pagos</option>
                <option value="unpaid">Não Pagos</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="filterDeliveredStatus">Entrega</label>
            <div class="form-select-wrap">
              <select class="form-input" id="filterDeliveredStatus">
                <option value="all">Todos</option>
                <option value="delivered">Entregues</option>
                <option value="undelivered">Pendentes</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="bottom-sheet__actions">
        <button class="btn btn-primary btn-full" id="btnApplyFilter">
          <i class="fas fa-filter"></i> Aplicar Filtros
        </button>
        <button class="btn btn-secondary btn-full" id="btnResetFilter">
          <i class="fas fa-times"></i> Limpar Filtros
        </button>
      </div>
    </div>

    <!-- Bottom Sheet: Confirmação excluir sessão -->
    <div class="bottom-sheet" id="confirmSheet" role="dialog" aria-modal="true">
      <div class="bottom-sheet__handle"></div>
      <p class="bottom-sheet__title" id="sheetTitle">Confirmar ação</p>
      <p class="bottom-sheet__desc" id="sheetDesc"></p>
      <div class="bottom-sheet__actions">
        <button class="btn btn-danger btn-full" id="sheetConfirm">Confirmar</button>
        <button class="btn btn-secondary btn-full" id="sheetCancel">Cancelar</button>
      </div>
    </div>

    <!-- ── CONTEÚDO PRINCIPAL ── -->
    <main class="app-main" id="appMain">

      <!-- Busca + botão filtros -->
      <div class="history-toolbar">
        <div class="search-bar" style="flex:1">
          <i class="fas fa-search search-bar__icon"></i>
          <input type="text" class="form-input" id="searchHistory" placeholder="Buscar em todas as sessões..." />
        </div>
        <button class="btn-filter-open" id="btnOpenFilter" aria-label="Abrir filtros">
          <i class="fas fa-sliders-h"></i>
        </button>
      </div>

      <!-- Lista de sessões -->
      <div id="sessionsList">
        <!-- Gerado dinamicamente -->
      </div>

    </main>

    <!-- ── SCRIPTS ── -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="./src/script/indexedDB.js"></script>
    <script src="./src/script/pdf.js"></script>
    <script src="./src/script/history.js"></script>
  </body>
</html>
