<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Painel de Administração de Usuários." />
    <meta name="theme-color" content="#ea580c" />
    <title>Administração — Gerenciamento de Itens</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./src/css/style.css?v=3" />
  </head>
  <body>

    <!-- 🌟 HEADER 🌟 -->
    <header class="app-header">
      <div class="app-header__logo">
        <button class="header-btn" id="sidebarToggle" aria-label="Menu" style="margin-right: var(--space-2); padding: 0; min-width: 40px;">
          <i class="fas fa-bars" style="font-size: 18px;"></i>
        </button>
        <span class="app-header__title">Painel Admin</span>
      </div>
      <div class="app-header__actions">
        <button class="header-btn" id="btnAddUser" title="Adicionar Usuário" style="background: var(--clr-brand-light); color: var(--clr-brand); padding: 0 var(--space-3); font-size: 14px; font-weight: 600;">
          <i class="fas fa-plus"></i> Novo
        </button>
      </div>
    </header>

    <!-- 🌟 SIDEBAR MENU 🌟 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-header">
        <span class="sidebar-title"><i class="fas fa-cookie-bite"></i> Menu</span>
        <button class="sidebar-close" id="sidebarClose" aria-label="Fechar menu">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="./index.html" class="sidebar-link" id="menuLinkCaixa"><i class="fas fa-cash-register"></i> Caixa / Início</a>
        <a href="./products.html" class="sidebar-link" id="menuLinkProdutos"><i class="fas fa-box-open"></i> Produtos</a>
        <a href="./kitchen.html" class="sidebar-link" id="menuLinkCozinha"><i class="fas fa-fire-burner"></i> Cozinha</a>
        <a href="./delivery.html" class="sidebar-link" id="menuLinkEntregas"><i class="fas fa-motorcycle"></i> Entregas</a>
        <a href="./history.html" class="sidebar-link" id="menuLinkHistorico"><i class="fas fa-history"></i> Histórico</a>
        <a href="./admin.html" class="sidebar-link" id="menuLinkAdmin" style="margin-top: auto; border-top: 1px solid var(--clr-border);"><i class="fas fa-users-cog"></i> Painel Admin</a>
      </nav>
    </aside>

    <!-- 🌟 TOAST CONTAINER 🌟 -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <!-- 🌟 OVERLAY / BOTTOM SHEET 🌟 -->
    <div class="overlay" id="overlay"></div>

    <!-- Bottom Sheet: Add/Edit User -->
    <div class="bottom-sheet" id="userSheet" role="dialog" aria-modal="true">
      <div class="bottom-sheet__handle"></div>
      <div class="bottom-sheet__header">
        <h2 class="bottom-sheet__title" id="userSheetTitle">Adicionar Usuário</h2>
        <button class="bottom-sheet__close" id="btnUserSheetClose"><i class="fas fa-times"></i></button>
      </div>
      
      <form id="userForm" class="bottom-sheet__form">
        <div class="form-group">
          <label class="form-label" for="userEmail">E-mail (obrigatório, Gmail)</label>
          <input type="email" class="form-input" id="userEmail" required placeholder="exemplo@gmail.com" />
        </div>
        
        <div class="form-group">
          <label class="form-label" for="userName">Nome do Usuário</label>
          <input type="text" class="form-input" id="userName" required placeholder="Ex: João Silva" />
        </div>

        <div class="form-group">
          <label class="form-label" for="userRole">Perfil de Acesso</label>
          <select class="form-input" id="userRole" required>
            <option value="caixa">Caixa (Pode ver Início e Histórico)</option>
            <option value="cozinha">Cozinha (Pode ver Preparo)</option>
            <option value="entregador">Entregador (Pode ver Entregas)</option>
            <option value="admin">Administrador (Pode ver tudo e Gerenciar Equipe)</option>
          </select>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 16px;">
          <input type="checkbox" id="userIsActive" checked style="width: 20px; height: 20px;" />
          <label for="userIsActive" style="font-weight: 600;">Usuário Ativo (Pode fazer login)</label>
        </div>
        
        <div class="bottom-sheet__actions" style="margin-top: 24px;">
          <button type="submit" class="btn btn-primary btn-full">Salvar Usuário</button>
        </div>
      </form>
    </div>

    <!-- 🌟 CONTEÚDO PRINCIPAL 🌟 -->
    <main class="app-main" id="appMain">
      
      <div style="margin-bottom: var(--space-4);">
        <p style="color: var(--clr-text-muted); font-size: 14px;">
          Gerencie quem tem acesso ao sistema. Apenas usuários cadastrados e ativos poderão fazer login.
        </p>
      </div>

      <!-- Lista de Usuários -->
      <section>
        <div class="items-list" id="usersList">
          <div class="items-empty">
            <div class="items-empty__icon"><i class="fas fa-users"></i></div>
            <div class="items-empty__text">Carregando equipe...</div>
          </div>
        </div>
      </section>

    </main>

    <!-- 🌟 SCRIPTS 🌟 -->
    <script src="./src/script/menu.js"></script>
    <script type="module" src="./src/script/admin.js"></script>
  </body>
</html>
